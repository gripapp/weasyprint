name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installing weasyprint is identical for both Rack versions, so it happens once here
      # rather than once per matrix leg.
      #
      # apt-get update only refreshes index files, so it's safe to hard-kill on a stall - that's
      # exactly what happened once before (14 minutes of silence against a mirror). The retry
      # loop below targets that.
      #
      # apt-get install unpacks and configures ~40MB of packages (weasyprint pulls in
      # numpy/scipy/sympy transitively), which legitimately takes a couple of minutes - killing
      # it mid-unpack doesn't just fail cleanly, it corrupts dpkg's state ("dpkg was
      # interrupted"), which then fails every subsequent retry regardless of the network. So
      # that phase gets apt's own network-timeout/retry options instead of an external kill, plus
      # a defensive `dpkg --configure -a` in case a previous attempt left things interrupted.
      - name: Install WeasyPrint
        timeout-minutes: 10
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)

          for attempt in 1 2 3; do
            sudo timeout 45 apt-get "${apt_opts[@]}" update && break
            echo "::warning::apt-get update stalled or failed (attempt $attempt/3), retrying"
            sleep 10
          done

          sudo dpkg --configure -a || true
          sudo apt-get "${apt_opts[@]}" install -y weasyprint

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      # Installs the committed root lockfile verbatim, so a Dependabot bump is tested as the
      # exact version set it proposes. Also the Rack 3 half of the compatibility matrix.
      - name: Rack 3 (root lockfile)
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_FROZEN: 'true'
        run: |
          bundle install
          bundle exec rspec

      # gemfiles/rack2.gemfile.lock is gitignored and resolves fresh, so there is nothing to
      # freeze. Runs even if the step above failed, so one Rack version failing doesn't hide
      # the other's result.
      - name: Rack 2
        if: always()
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack2.gemfile
          BUNDLE_FROZEN: 'false'
        run: |
          bundle install
          bundle exec rspec
